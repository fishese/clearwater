name: iOS unsigned device build

on:
  workflow_dispatch:
    inputs:
      run_native_tests:
        description: Run hosted native regression (cold simulator can take 15 minutes)
        type: boolean
        default: true
  workflow_call:
    inputs:
      run_native_tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  safari-photo-switch-regression:
    name: Test iPhone saving, comparison and switching in WebKit
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install locked dependencies
        working-directory: editor
        run: npm ci
      - name: Build production web assets
        working-directory: editor
        run: npm run build
      - name: Install Playwright WebKit
        working-directory: editor
        run: npx playwright install webkit chromium
      - name: Run WebKit photo-switch regression
        working-directory: editor
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/clearwater-web-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          CHECK_BROWSER=webkit CHECK_URL=http://127.0.0.1:4173/ node scripts/photo-switch-check.mjs
          CHECK_BROWSER=webkit CHECK_IOS_SHELL=1 CHECK_URL=http://127.0.0.1:4173/ node scripts/photo-switch-check.mjs
          CHECK_BROWSER=webkit CHECK_URL=http://127.0.0.1:4173/ node scripts/photo-switch-smoke.mjs
          CHECK_BROWSER=webkit CHECK_URL=http://127.0.0.1:4173/ node scripts/comparison-band-check.mjs
          CHECK_BROWSER=chromium CHECK_URL=http://127.0.0.1:4173/ node scripts/comparison-touch-check.mjs
          CHECK_BROWSER=webkit CHECK_URL=http://127.0.0.1:4173/ node scripts/comparison-touch-check.mjs
          CHECK_BROWSER=chromium CHECK_URL=http://127.0.0.1:4173/ node scripts/comparison-edge-layout-check.mjs
          CHECK_BROWSER=webkit CHECK_URL=http://127.0.0.1:4173/ node scripts/comparison-edge-layout-check.mjs
          for ios_browser in safari chrome; do
            for can_share in missing false true; do
              CHECK_BROWSER=webkit CHECK_IOS_BROWSER="$ios_browser" CHECK_CAN_SHARE="$can_share" CHECK_URL=http://127.0.0.1:4173/ node scripts/ios-web-export-check.mjs
            done
          done
  unsigned-device-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install locked dependencies
        working-directory: editor
        run: npm ci
      - name: Run shared unit tests
        working-directory: editor
        run: npm test
      - name: Select and verify Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -q '^Xcode 26\.6' "$RUNNER_TEMP/xcode-version.txt"
      - name: Build root-relative web assets and sync iOS only
        working-directory: editor
        run: npm run ios:sync
      - name: Resolve Capacitor Swift packages
        working-directory: editor
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Build unsigned physical-device app
        working-directory: editor
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/clearwater-ios-build"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - name: Verify app and package IPA
        working-directory: editor
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/clearwater-ios-build/Build/Products/Release-iphoneos/App.app"
          PACKAGE="$RUNNER_TEMP/clearwater-ipa"
          OUT="$RUNNER_TEMP/clearwater-unsigned.ipa"
          node scripts/ios-package-check.mjs --app "$APP"
          mkdir -p "$PACKAGE/Payload"
          ditto "$APP" "$PACKAGE/Payload/ClearWater.app"
          (cd "$PACKAGE" && /usr/bin/zip -qry "$OUT" Payload)
          node scripts/ios-package-check.mjs --ipa "$OUT"
          cp "$OUT" "$GITHUB_WORKSPACE/ClearWater-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/ClearWater-unsigned.ipa" > "$GITHUB_WORKSPACE/ClearWater-unsigned.ipa.sha256"
          printf 'commit=%s\nworkflow=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" > "$GITHUB_WORKSPACE/ios-build-commit.txt"
          cat "$RUNNER_TEMP/xcode-version.txt" >> "$GITHUB_WORKSPACE/ios-build-commit.txt"
      - name: Upload unsigned IPA and provenance
        uses: actions/upload-artifact@v4
        with:
          name: ClearWater-iOS-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            ClearWater-unsigned.ipa
            ClearWater-unsigned.ipa.sha256
            ios-build-commit.txt
  native-export-regression:
    name: Test native iOS capture, storage and export
    if: inputs.run_native_tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install locked dependencies
        working-directory: editor
        run: npm ci
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Build assets and sync iOS
        working-directory: editor
        run: npm run ios:sync
      - name: Verify shared-engine native fixtures
        working-directory: editor
        run: |
          node scripts/generate-ios-native-fixtures.mjs
          git diff --exit-code -- ios/App/AppTests/balanced-parity-fixtures.json
      - name: Test native scene, camera math, capture storage and writer
        timeout-minutes: 20
        working-directory: editor
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, entries in devices.items() if "iOS-26" in runtime for d in entries if d.get("isAvailable") and d["name"].startswith("iPhone")))')"
          xcodebuild test -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/clearwater-ios-tests" \
            -resultBundlePath "$RUNNER_TEMP/clearwater-native-tests.xcresult" \
            -destination-timeout 120 -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ENABLE_TESTABILITY=YES
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClearWater-iOS-native-tests-${{ github.sha }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/clearwater-native-tests.xcresult
