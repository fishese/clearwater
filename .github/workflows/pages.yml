name: Publish web editor
on:
  push:
    branches: [main]
    paths: ['editor/**', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      ios_native_tests:
        description: Run native iOS regression for the feature branch
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('ios-sideload-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
jobs:
  ios-sideload:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ios-native-camera'
    permissions:
      contents: read
    uses: ./.github/workflows/ios-build.yml
    with:
      run_native_tests: ${{ inputs.ios_native_tests }}
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
        working-directory: editor
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm test && npm run build
        working-directory: editor
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_IOS_IPA_URL: ${{ vars.IOS_IPA_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: editor/dist
      - uses: actions/deploy-pages@v4
        id: deployment
