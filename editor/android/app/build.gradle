apply plugin: 'com.android.application'

// Local signing credentials are never committed or copied into build artifacts.
def releaseCredentials = new Properties()
def releaseCredentialsFile = rootProject.file('keystore.properties')
if (releaseCredentialsFile.exists()) {
    releaseCredentialsFile.withInputStream { releaseCredentials.load(it) }
}
def hasReleaseCredentials = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    releaseCredentials.getProperty(it)?.trim()
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !hasReleaseCredentials) {
    throw new GradleException('Release signing requires android/keystore.properties with all four signing properties.')
}


android {
    namespace = "com.fishese.clearwater"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fishese.clearwater"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "1.0.3-camera.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseCredentials) {
            release {
                storeFile rootProject.file(releaseCredentials.getProperty('storeFile'))
                storePassword releaseCredentials.getProperty('storePassword')
                keyAlias releaseCredentials.getProperty('keyAlias')
                keyPassword releaseCredentials.getProperty('keyPassword')
            }
        }
        debug {
            // Standard public Android test credentials, never used for release signing.
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Debug-signed, but exercise the same R8 optimizations as a release build.
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            if (hasReleaseCredentials) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.media3:media3-common:1.11.1"
    implementation "androidx.media3:media3-effect:1.11.1"
    implementation "androidx.media3:media3-transformer:1.11.1"
    implementation "androidx.camera:camera-camera2:1.6.2"
    implementation "androidx.camera:camera-lifecycle:1.6.2"
    implementation "androidx.camera:camera-view:1.6.2"
    implementation "androidx.camera:camera-video:1.6.2"
    implementation "androidx.camera.media3:media3-effect:1.0.0-alpha04"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
